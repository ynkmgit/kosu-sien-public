<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数支援 | {% block title %}{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_url('styles.css') }}">
    <script src="{{ static_url('calc.js') }}"></script>
</head>
<body>
    {% set fp = filter_params|default({}) %}
    <div class="container">
        <header class="navbar">
            <a href="/{{ filter_qs(fp) }}" class="logo">
                <span class="logo-text">工数支援</span>
                <span class="logo-sub">PM</span>
            </a>
            <nav class="nav-links">
                <a href="/work-logs{{ filter_qs(fp) }}" class="nav-link {% if active == 'work_logs' %}active{% endif %}">実績入力</a>
                <a href="/monthly-assignments{{ filter_qs(fp) }}" class="nav-link {% if active == 'monthly_assignments' %}active{% endif %}">月次アサイン</a>
                <a href="/assignments{{ filter_qs(fp) }}" class="nav-link {% if active == 'assignments' %}active{% endif %}">アサイン管理</a>
                <a href="/work-report{{ filter_qs(fp) }}" class="nav-link {% if active == 'work_report' %}active{% endif %}">報告テンプレート</a>
                <span class="nav-sep"></span>
                <a href="/projects{{ filter_qs(fp) }}" class="nav-link {% if active == 'projects' %}active{% endif %}">PJ一覧</a>
                <span class="nav-sep"></span>
                <a href="/users{{ filter_qs(fp) }}" class="nav-link {% if active == 'users' %}active{% endif %}">ユーザー</a>
                <a href="/user-attribute-types{{ filter_qs(fp) }}" class="nav-link {% if active == 'user-attributes' %}active{% endif %}">属性タイプ</a>
            </nav>
            <span class="version">v1.0.0</span>
        </header>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
